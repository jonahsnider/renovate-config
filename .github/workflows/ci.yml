name: CI

on: [push, pull_request]

jobs:
  style:
    name: Check style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
      - parallel:
          - name: Check style
            run: pnpm run style
          - name: Lint
            run: pnpm run lint
          - name: Test Renovate CE enqueue helper
            run: pnpm run test:enqueue
          - name: Check for duplicate package groups
            run: pnpm run check:duplicate-groups
          - name: Check Railway config
            run: pnpm run check:railway
          - name: Check codemods
            run: pnpm run check:codemods
          - name: Validate Renovate config
            run: pnpm run validate
  publish:
    name: Publish

    runs-on: ubuntu-latest

    needs: [style]

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
      - name: Run semantic release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
