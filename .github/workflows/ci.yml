name: CI

on: [push, pull_request]

jobs:
  style:
    name: Check style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          cache: true
      - name: Check style
        run: pnpm run style
      - name: Lint
        run: pnpm run lint
      - name: Test Renovate CE enqueue helper
        run: pnpm run test:enqueue
      - name: Check for duplicate package groups
        run: pnpm run check:duplicate-groups
      - name: Validate Renovate config
        run: pnpm run validate
  publish:
    name: Publish

    runs-on: ubuntu-latest

    needs: [style]

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          cache: true
      - name: Run semantic release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
