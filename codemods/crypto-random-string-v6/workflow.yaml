# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: '1'

nodes:
  - id: apply-transforms
    name: Migrate crypto-random-string v6
    type: automatic
    steps:
      - name: Replace the removed async import with the default sync import
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: '.'
          language: 'tsx'
          semantic_analysis: 'file'
          include:
            - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
          exclude:
            - '**/node_modules/**'
            - '**/dist/**'
            - '**/build/**'
